<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>L20 · 🔁 Wiederholung gemischt</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1f2430;--mut:#6b7280;--ac:#58cc02;--acd:#46a302;--bad:#ea2b2b;--bd:#e5e7eb;--okbg:#e7f9d4;--badbg:#ffe1e1}
@media(prefers-color-scheme:dark){:root{--bg:#131820;--card:#1d242f;--tx:#eef1f6;--mut:#9aa4b2;--bd:#2c3542;--okbg:#1f3a14;--badbg:#3f1b1b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:18px/1.55 system-ui,-apple-system,sans-serif;padding:16px;max-width:640px;margin-inline:auto;padding-bottom:120px}
a.back{display:inline-block;padding:10px 0;color:var(--ac);text-decoration:none;font-weight:600}
h1{font-size:24px;margin:4px 0 12px}
.bar{height:10px;background:var(--bd);border-radius:5px;overflow:hidden;margin:8px 0 16px}
.bar i{display:block;height:100%;width:0;background:var(--ac);transition:width .3s}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:14px}
.ex{background:var(--okbg);border-radius:12px;padding:12px;margin-top:10px}
code{background:var(--bd);padding:1px 6px;border-radius:6px}
.btn{display:block;width:100%;min-height:54px;padding:14px;font-size:18px;font-weight:700;border-radius:14px;border:2px solid var(--bd);border-bottom-width:4px;background:var(--card);color:var(--tx);margin:10px 0;text-align:left;cursor:pointer}
.btn.go{background:var(--ac);border-color:var(--acd);color:#fff;text-align:center}
.btn.ok{background:var(--okbg);border-color:var(--ac)}
.btn.no{background:var(--badbg);border-color:var(--bad)}
.btn:disabled{opacity:1;cursor:default}
input.in{width:100%;min-height:54px;padding:12px;font-size:20px;border-radius:14px;border:2px solid var(--bd);background:var(--card);color:var(--tx)}
.fb{border-radius:14px;padding:14px;margin-top:12px}
.fb.ok{background:var(--okbg)}.fb.no{background:var(--badbg)}
.hide{display:none}
.mut{color:var(--mut);font-size:15px}
.res{font-family:ui-monospace,monospace;background:var(--bd);padding:12px;border-radius:12px;word-break:break-all}
.rep{display:inline-block;font-size:13px;background:#ffb02e;color:#222;border-radius:8px;padding:2px 8px;margin-bottom:6px}

.fig{width:100%;height:auto;display:block;margin:4px 0 10px}
.fig text{paint-order:stroke;stroke:var(--card);stroke-width:4px;stroke-linejoin:round;fill:var(--tx);font-family:system-ui,-apple-system,sans-serif;font-size:15px}
.fig .big{font-size:19px;font-weight:700}
.fig .mt{fill:var(--mut)}
.fig .hlt,.fig tspan.hlt{fill:var(--acd);font-weight:700}
.fig .badt{fill:var(--bad);font-weight:700}
.fig tspan.bl{fill:#3b82f6;font-weight:700}.fig tspan.or{fill:#f59e0b;font-weight:700}
.fig .bx{fill:var(--card);stroke:var(--bd);stroke-width:2}
.fig .bxg{fill:var(--okbg);stroke:var(--ac);stroke-width:2}
.fig .bxr{fill:var(--badbg);stroke:var(--bad);stroke-width:2}
.fig .ar{stroke:var(--mut);stroke-width:2}.fig .ahf{fill:var(--mut)}
.fig .ax{stroke:var(--mut);stroke-width:1.2}
.fig .cv{fill:none;stroke:var(--mut);stroke-width:2;opacity:.55}
.fig .cvh{fill:none;stroke:var(--ac);stroke-width:3.5}
.fig .fl{stroke:#3b82f6;stroke-width:1.8;stroke-linecap:round}
.fig .dash{stroke:var(--bad);stroke-width:1.5;stroke-dasharray:5 4}
.fig .dt{fill:var(--ac);stroke:var(--card);stroke-width:2}
.fig .acl{stroke:var(--ac);stroke-width:2}
.fig .bad{stroke:var(--bad);stroke-width:3}
.ct{font-size:18px;margin:4px 2px 0}
.dots{display:flex;gap:6px;justify-content:center;margin:6px 0}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--bd)}.dots i.on{background:var(--ac)}

.fig .cvr{fill:none;stroke:var(--bad);stroke-width:3}
.fig .cvo{fill:none;stroke:#f59e0b;stroke-width:3}
.fig .cvb{fill:none;stroke:#3b82f6;stroke-width:3}
.fig .ort{fill:#d97706;font-weight:700}.fig .blt{fill:#3b82f6;font-weight:700}
.fig .wire{fill:none;stroke:var(--tx);stroke-width:2}
.fig .wire3{stroke:var(--tx);stroke-width:4}
.fig .bgr{fill:var(--card);stroke:none}
.fig .bxk{fill:var(--bd);stroke:var(--tx);stroke-width:2}
.fig .fa{stroke:var(--ac);stroke-width:4}.fig .fr{stroke:var(--bad);stroke-width:4}
</style>
</head>
<body>
<a class="back" href="../index.html">← Übersicht</a>
<h1 id="ttl">L20 · 🔁 Wiederholung gemischt</h1>
<div class="bar"><i id="bar"></i></div>

<!-- 1) ERKLÄRUNG -->
<section id="intro">
  <div class="card">
<svg viewBox="0 0 340 180" class="fig" xmlns="http://www.w3.org/2000/svg"><rect x="6" y="6" width="160" height="76" rx="12" class="bx"/><text x="86" y="36" text-anchor="middle" class="hlt" style="font-size:15px">Trennen</text><text x="86" y="62" text-anchor="middle" class="" style="font-size:13px">y′ = f(x)·g(y)</text><rect x="174" y="6" width="160" height="76" rx="12" class="bx"/><text x="254" y="36" text-anchor="middle" class="hlt" style="font-size:15px">Linear</text><text x="254" y="62" text-anchor="middle" class="" style="font-size:13px">y = y_h + y_p</text><rect x="6" y="90" width="160" height="76" rx="12" class="bx"/><text x="86" y="120" text-anchor="middle" class="hlt" style="font-size:15px">Variation</text><text x="86" y="146" text-anchor="middle" class="" style="font-size:13px">C → C(x)</text><rect x="174" y="90" width="160" height="76" rx="12" class="bx"/><text x="254" y="120" text-anchor="middle" class="hlt" style="font-size:15px">Anwendungen</text><text x="254" y="146" text-anchor="middle" class="" style="font-size:13px">k aus Messwert</text></svg><p class="ct">🔁 Querbeet durch alles.</p>
  </div>
  <button class="btn go" id="start">Los geht's →</button>
</section>

<!-- 2) QUIZ -->
<section id="quiz" class="hide">
  <div class="mut" id="cnt"></div>
  <div class="card"><div id="rep" class="hide"><span class="rep">🔁 Wiederholung</span></div><div id="q"></div></div>
  <div id="ans"></div>
  <div id="fb" class="fb hide"></div>
  <button class="btn go hide" id="next">Weiter →</button>
</section>

<!-- 3) ERGEBNIS -->
<section id="end" class="hide">
  <div class="card">
    <h2 id="score"></h2>
    <p id="xpmsg"></p>
    <p class="mut">Schick mir diesen Code im Chat, dann trage ich es in dein progress.json ein:</p>
    <div class="res" id="code"></div>
    <button class="btn go" id="copy">📋 Code kopieren</button>
  </div>
  <a class="btn go" href="../index.html" style="text-decoration:none">Zur Übersicht</a>
</section>

<script>
var LESSON_ID="20";
/* Fragetypen:
   {t:"mc",  q:"Frage", o:["A","B","C"], a:1, e:"Erklärung", topic:"Thema", rep:false}
   {t:"fill",q:"Der ___ ist …", a:["antwort","alt. schreibweise"], e:"Erklärung", topic:"Thema"}
   {t:"calc",q:"12·3 = ?", a:36, tol:0, e:"Rechenweg", topic:"Thema"}  */
var Q=[
  {t:"calc",q:"Ordnung von y″ + 3y′ = x?",a:2,tol:0,e:"Höchste Ableitung y″.",topic:"Ordnung einer DGL",rep:true},
  {t:"mc",q:"Löse y′ = y·cos(x).",o:["y = C·e^(sin x)","y = C·e^(−sin x)","y = sin(x) + C"],a:0,e:"dy/y = cos(x) dx → ln|y| = sin(x) + C.",topic:"Trennen der Variablen",rep:true},
  {t:"calc",q:"y′ = 2·(3 − y), y(0) = 1. Berechne y(1).",a:2.73,tol:0.01,e:"y = 3 − 2·e^(−2x) → y(1) = 3 − 2e^(−2) ≈ 2,73",topic:"Beschränktes Wachstum",rep:true},
  {t:"calc",q:"y′ = x − y. Steigung in P(2|5)?",a:-3,tol:0,e:"2 − 5 = −3",topic:"Steigung im Richtungsfeld",rep:true},
  {t:"calc",q:"y′ + 2x·y = 2x (Variation): y_p = ?",a:1,tol:0,e:"y_h = C·e^(−x²). C′·e^(−x²) = 2x → C′ = 2x·e^(x²) → C = e^(x²) → y_p = 1.",topic:"Variation der Konstanten",rep:true},
  {t:"calc",q:"y′ − y = 2x, Ansatz Ax + B. B = ?",a:-2,tol:0,e:"A − Ax − B = 2x → −A = 2 → A = −2; A − B = 0 → B = −2.",topic:"Koeffizientenvergleich",rep:true},
  {t:"calc",q:"Abkühlung 90 °C → 60 °C in 5 min, Umgebung 20 °C. k = ? (4 Dezimalen)",a:0.1119,tol:0.0005,e:"e^(−5k) = 40/70 → k = −ln(0,5714)/5 ≈ 0,1119",topic:"k aus Messwert",rep:true},
  {t:"mc",q:"Was ist die Lösung einer Anfangswertaufgabe?",o:["eine Funktionenschar","eine Funktion","eine Zahl"],a:1,e:"Die Anfangsbedingung legt C fest.",topic:"allgemeine vs. spezielle Lösung",rep:true}
];

var i=0,right=0,wrong=[],$=function(id){return document.getElementById(id)};
function show(id){["intro","quiz","end"].forEach(function(s){$(s).classList.toggle("hide",s!==id)})}
$("start").onclick=function(){show("quiz");ask()};
function norm(s){return String(s).trim().toLowerCase().replace(/\s+/g," ")}
function ask(){
  var x=Q[i];$("cnt").textContent="Frage "+(i+1)+" von "+Q.length;
  $("bar").style.width=(i/Q.length*100)+"%";
  $("rep").classList.toggle("hide",!x.rep);
  $("q").textContent=x.q;$("fb").className="fb hide";$("next").classList.add("hide");
  var a=$("ans");a.innerHTML="";
  if(x.t==="mc"){x.o.forEach(function(o,k){var b=document.createElement("button");b.className="btn";b.textContent=o;b.onclick=function(){done(k===x.a,b)};a.appendChild(b)})}
  else{
    var inp=document.createElement("input");inp.className="in";inp.autocomplete="off";inp.autocapitalize="none";
    if(x.t==="calc")inp.inputMode="decimal";
    var b=document.createElement("button");b.className="btn go";b.textContent="Prüfen";
    b.onclick=function(){
      var v=inp.value;if(!v.trim())return;var ok;
      if(x.t==="calc"){ok=Math.abs(parseFloat(v.replace(",","."))-x.a)<=(x.tol||0)}
      else{ok=x.a.some(function(z){return norm(z)===norm(v)})}
      inp.disabled=true;done(ok,b)};
    a.appendChild(inp);a.appendChild(b);
  }
}
function done(ok,btn){
  var x=Q[i];
  if(x.t==="mc"){var bs=$("ans").children;for(var k=0;k<bs.length;k++){bs[k].disabled=true;if(k===x.a)bs[k].classList.add("ok")}if(!ok)btn.classList.add("no")}
  else btn.disabled=true;
  if(ok)right++;else wrong.push(i+1);
  var sol=x.t==="mc"?x.o[x.a]:(x.t==="calc"?x.a:x.a[0]);
  var f=$("fb");f.className="fb "+(ok?"ok":"no");
  f.innerHTML=(ok?"✅ <b>Richtig!</b> ":"❌ <b>Nicht ganz.</b> Richtig: <b>"+sol+"</b>. ")+"<br>"+x.e;
  var n=$("next");n.classList.remove("hide");n.textContent=i===Q.length-1?"Ergebnis →":"Weiter →";
  n.scrollIntoView({behavior:"smooth",block:"center"});
}
$("next").onclick=function(){i++;if(i<Q.length)ask();else finish()};
function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function finish(){
  $("bar").style.width="100%";show("end");
  var xp=right*10+20+(right===Q.length?10:0);
  var sc=right+"/"+Q.length;
  $("score").textContent=(right===Q.length?"🎉 ":"👍 ")+sc+" richtig";
  $("xpmsg").textContent="+"+xp+" XP";
  var code="L"+LESSON_ID+" "+sc+(wrong.length?" falsch:"+wrong.join(","):"");
  $("code").textContent=code;
  $("copy").onclick=function(){
    if(navigator.clipboard)navigator.clipboard.writeText(code).then(function(){$("copy").textContent="✓ Kopiert"},function(){});
  };
  try{
    var L=JSON.parse(localStorage.getItem("lern")||"{}"),t=today();
    L.done=L.done||{};
    if(!L.done[LESSON_ID]){L.xp=(L.xp||0)+xp}
    L.done[LESSON_ID]={score:sc,date:t};
    if(L.last!==t){var d=L.last?(new Date(t)-new Date(L.last))/864e5:99;L.streak=d<=1?(L.streak||0)+1:1;L.last=t}
    localStorage.setItem("lern",JSON.stringify(L));
  }catch(e){}
}
</script>
</body>
</html>

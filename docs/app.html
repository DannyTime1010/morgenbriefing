<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1f2430;--mut:#6b7280;--ac:#58cc02;--acd:#46a302;--bad:#ea2b2b;--bd:#e5e7eb;--okbg:#e7f9d4;--badbg:#ffe1e1}
@media(prefers-color-scheme:dark){:root{--bg:#131820;--card:#1d242f;--tx:#eef1f6;--mut:#9aa4b2;--bd:#2c3542;--okbg:#1f3a14;--badbg:#3f1b1b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:18px/1.55 system-ui,-apple-system,sans-serif;padding:16px;max-width:640px;margin-inline:auto;padding-bottom:120px}
h1{font-size:24px;margin:4px 0 12px}
.hide{display:none!important}
.mut{color:var(--mut);font-size:15px}
.top{display:flex;justify-content:space-between;align-items:center}
.lnk{color:var(--ac);font-weight:600;background:none;border:0;font-size:17px;padding:10px 0;cursor:pointer}
.stats{display:flex;gap:10px;margin:14px 0}
.stat{flex:1;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px;text-align:center}
.stat b{display:block;font-size:26px}
.day{font-size:19px;margin:22px 0 4px}
.book{font-size:15px;color:var(--mut);padding:4px 4px 0}
.ls{display:flex;align-items:center;gap:12px;width:100%;background:var(--card);border:2px solid var(--bd);border-bottom-width:4px;border-radius:14px;padding:14px;margin:10px 0;color:var(--tx);min-height:60px;font-size:17px;text-align:left;cursor:pointer}
.ls.done{background:var(--okbg);border-color:var(--ac)}
.ls:disabled{opacity:.5;cursor:default}
.n{font-weight:800;min-width:34px}
.sc{margin-left:auto;font-size:14px;color:var(--mut);white-space:nowrap}
.bar{height:10px;background:var(--bd);border-radius:5px;overflow:hidden;margin:8px 0 16px}
.bar i{display:block;height:100%;width:0;background:var(--ac);transition:width .3s}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:14px}
.ex{background:var(--okbg);border-radius:12px;padding:12px;margin-top:10px}
code{background:var(--bd);padding:1px 6px;border-radius:6px}
.btn{display:block;width:100%;min-height:54px;padding:14px;font-size:18px;font-weight:700;border-radius:14px;border:2px solid var(--bd);border-bottom-width:4px;background:var(--card);color:var(--tx);margin:10px 0;text-align:left;cursor:pointer}
.btn.go{background:var(--ac);border-color:var(--acd);color:#fff;text-align:center}
.btn.ok{background:var(--okbg);border-color:var(--ac)}
.btn.no{background:var(--badbg);border-color:var(--bad)}
.btn:disabled{opacity:1;cursor:default}
input.in{width:100%;min-height:54px;padding:12px;font-size:20px;border-radius:14px;border:2px solid var(--bd);background:var(--card);color:var(--tx)}
.fb{border-radius:14px;padding:14px;margin-top:12px}
.fb.ok{background:var(--okbg)}.fb.no{background:var(--badbg)}
.res{font-family:ui-monospace,monospace;background:var(--bd);padding:12px;border-radius:12px;word-break:break-all}
.rep{display:inline-block;font-size:13px;background:#ffb02e;color:#222;border-radius:8px;padding:2px 8px;margin-bottom:6px}
</style>
</head>

"file": null}, {"id": "15", "title": "Flüchtiger & stationärer Teil", "day": "So 22.11.", "file": null}, {"id": "16", "title": "RC-Glied", "day": "So 22.11.", "file": null}, {"id": "17", "title": "RL-Glied", "day": "So 22.11.", "file": null}, {"id": "18", "title": "Wiederholung Tag 2", "day": "So 22.11.", "file": null}, {"id": "19", "title": "Variation der Konstanten", "day": "Mo 23.11.", "file": null}, {"id": "20", "title": "Wiederholung gemischt", "day": "Mo 23.11.", "file": null}, {"id": "21", "title": "Textaufgaben gemischt", "day": "Di 24.11.", "file": null}, {"id": "22", "title": "Wiederholung gemischt", "day": "Di 24.11.", "file": null}, {"id": "23", "title": "Probe-SA Teil 1", "day": "Mi 25.11.", "file": null}, {"id": "24", "title": "Probe-SA Teil 2 + Wissens-Check", "day": "Mi 25.11.", "file": null}]};
var LESSONS={"01":{intro:"<p>Eine <b>Differentialgleichung (DGL)</b> verbindet eine gesuchte Funktion y mit ihren Ableitungen.</p>\n    <p><b>Ordnung</b> = höchste vorkommende Ableitung. Hochzahlen wie y³ zählen nicht.</p>\n    <p>Die Lösung einer DGL ist eine <b>Funktionenschar</b> mit Konstante C: die <b>allgemeine Lösung</b>. Eine <b>Anfangsbedingung</b> wie y(0) = 3 legt C fest. Dann hast du genau eine Funktion: die <b>spezielle Lösung</b>.</p>\n    <p>Faustregel: Ordnung n → n Bedingungen nötig.</p>\n    <p>Textaufgaben: „direkt proportional zu y\" → <code>k·y</code>, „indirekt proportional zu y\" → <code>k/y</code>.</p>\n    <div class=\"ex\"><b>Beispiel:</b> y′ = 2x (1. Ordnung)<br>Allgemein: y = x² + C<br>y(0) = 3 → 3 = 0 + C → C = 3<br>Speziell: y = x² + 3</div>",Q:[
  {t:"calc",q:"Welche Ordnung hat 4y″ + 3y′ − 5y³ = 3·sin(2x)?",a:2,tol:0,e:"Höchste Ableitung ist y″ → Ordnung 2. Das y³ ist nur eine Potenz, keine Ableitung. (Wissens-Check 1)",topic:"Ordnung einer DGL"},
  {t:"calc",q:"y′ = y‴ − 2y″ + 3x: Wie viele Anfangsbedingungen brauchst du für eine spezielle Lösung?",a:3,tol:0,e:"Höchste Ableitung ist y‴ → 3. Ordnung → 3 Bedingungen, z. B. y(0), y′(0), y″(0). (vgl. 4.11)",topic:"Anzahl Anfangsbedingungen"},
  {t:"mc",q:"Die Lösung einer Anfangswertaufgabe ist …",o:["eine Zahl","eine Funktionenschar","eine einzelne Funktion"],a:2,e:"Die DGL allein liefert eine Funktionenschar (allgemeine Lösung). Die Anfangsbedingung wählt daraus genau eine Funktion aus (spezielle Lösung). (Wissens-Check 3)",topic:"allgemeine vs. spezielle Lösung"},
  {t:"mc",q:"„Die Änderung des Luftdrucks p abhängig von der Höhe h ist direkt proportional zum Luftdruck.“ Welche DGL passt?",o:["dp/dh = k/p","dp/dh = k·h","dp/dh = k·p","dh/dp = k·p"],a:2,e:"„Änderung von p nach h“ = dp/dh. „direkt proportional zu p“ = k·p. (4.6)",topic:"DGL aus Text aufstellen"},
  {t:"mc",q:"„Die erste Ableitung von y nach x ist indirekt proportional zu y.“",o:["dy/dx = k·y","dy/dx = k/y","dy/dx = k/x","dy/dx = k·x"],a:1,e:"Indirekt proportional heißt: y steht im Nenner → k/y. (4.7)",topic:"DGL aus Text aufstellen"},
  {t:"calc",q:"Allgemeine Lösung von y′ = 2x ist y = x² + C. Berechne C für y(1) = 4.",a:3,tol:0,e:"Einsetzen: 4 = 1² + C → C = 3. Spezielle Lösung: y = x² + 3.",topic:"Konstante aus Anfangsbedingung"},
  {t:"mc",q:"Ist y = 3·e^(2x) eine Lösung von y′ = 2y?",o:["Ja","Nein"],a:0,e:"Probe: y′ = 6·e^(2x). Und 2y = 2·3·e^(2x) = 6·e^(2x). Beide Seiten gleich → ja.",topic:"Probe einer Lösung"},
  {t:"mc",q:"f(x) = C·e^(−0,5x): Welchen Einfluss hat C auf den Graphen?",o:["Verschiebt den Graphen nach links/rechts","Streckt den Graphen in y-Richtung (f(0) = C)","Ändert, wie schnell der Graph fällt"],a:1,e:"C ist ein Faktor vor der e-Funktion: Er streckt in y-Richtung, und f(0) = C. Wie schnell es fällt, bestimmt die −0,5. (4.12)",topic:"Parameter C in der Lösungsschar"}
]},
"02":{intro:"<p>Bei Textaufgaben übersetzt du Sätze in eine DGL. Die wichtigsten Bausteine:</p>\n<p><b>„Änderung von y nach x\"</b> → <code>dy/dx</code> bzw. <code>y′</code><br>\n<b>„Steigung der Tangente\"</b> → <code>y′</code><br>\n<b>„direkt proportional zu A\"</b> → <code>k·A</code><br>\n<b>„indirekt proportional zu A\"</b> → <code>k/A</code><br>\n<b>„nimmt ab\"</b> → Minus: <code>−k·…</code> (mit k &gt; 0)</p>\n<p>Mehrere Teile werden kombiniert: „direkt proportional zu p und indirekt proportional zu T²\" → <code>k·p/T²</code>.</p>\n    <div class=\"ex\"><b>Beispiel:</b><br>„Die Steigung der Tangente ist gleich der dritten Wurzel aus der x-Koordinate.“<br>→ y′ = ∛x</div>",Q:[
  {t:"mc",q:"„Die Steigung der Tangente ist in jedem Punkt gleich dem Quadrat der x-Koordinate.“",o:["y′ = 2x","y′ = x²","y′ = y²","y″ = x²"],a:1,e:"Steigung der Tangente = y′. Quadrat der x-Koordinate = x². Also y′ = x². (4.8a)",topic:"DGL aus Text aufstellen"},
  {t:"mc",q:"„Die Steigung ist gleich der Summe aus x- und y-Koordinate.“",o:["y′ = x·y","y′ = x + y","y′ + y = x","y = x + y′"],a:1,e:"Summe = Plus. y′ = x + y. (4.8c)",topic:"DGL aus Text aufstellen"},
  {t:"mc",q:"„Die Steigung ist gleich dem Kehrwert des Produkts aus x- und y-Koordinate.“",o:["y′ = x·y","y′ = 1/x + 1/y","y′ = 1/(x·y)","y′ = y/x"],a:2,e:"Produkt = x·y, Kehrwert = 1 durch das Ganze → y′ = 1/(x·y). (4.8d)",topic:"DGL aus Text aufstellen"},
  {t:"mc",q:"Die Menge M an Kartoffelchips nimmt ab. Die Änderungsrate ist direkt proportional zur vorhandenen Menge (k > 0).",o:["dM/dt = k·M","dM/dt = −k·M","dM/dt = −k/M","dM/dt = −k·t"],a:1,e:"Direkt proportional zu M → k·M. Abnahme → Minus. (4.9a)",topic:"Vorzeichen bei Abnahme"},
  {t:"mc",q:"Freier Fall: Die Änderung der Geschwindigkeit v in Abhängigkeit von der Höhe h ist indirekt proportional zur Wurzel aus der Höhe.",o:["dv/dh = k·√h","dh/dv = k/√h","dv/dh = k/√h","dv/dt = k/√h"],a:2,e:"„Änderung von v nach h“ = dv/dh. Indirekt proportional zu √h → k/√h. (4.10a)",topic:"DGL aus Text aufstellen"},
  {t:"mc",q:"Die Änderung des Dampfdrucks p nach der Temperatur T ist direkt proportional zu p und indirekt proportional zum Quadrat von T.",o:["dp/dT = k·p·T²","dp/dT = k·p/T²","dp/dT = k·T²/p","dT/dp = k·p/T²"],a:1,e:"Direkt zu p → p in den Zähler. Indirekt zu T² → T² in den Nenner. dp/dT = k·p/T². (4.10c)",topic:"DGL aus Text aufstellen"},
  {t:"fill",q:"Bei einer Abnahme schreibt man vor k (mit k > 0) ein ___ (Wort oder Zeichen).",a:["minus","-","−","negativ","minuszeichen"],e:"Abnahme → −k·…, damit die Ableitung negativ ist.",topic:"Vorzeichen bei Abnahme"},
  {t:"calc",q:"Welche Ordnung hat 5y′ − 2y² = x?",a:1,tol:0,e:"Höchste Ableitung ist y′ → 1. Ordnung. y² ist nur eine Potenz.",topic:"Ordnung einer DGL",rep:true}
]},
"03":{intro:"<p>Eine DGL der Form <code>y′ = f(x, y)</code> sagt dir in jedem Punkt (x|y) die <b>Steigung</b> der Lösungskurve.</p>\n<p>Zeichnest du in einem Punkt ein kurzes Strichstück mit genau dieser Steigung, ist das ein <b>Linienelement</b>. Viele Linienelemente zusammen = <b>Richtungsfeld</b>.</p>\n<p>Eine Lösungskurve läuft immer entlang der Linienelemente.</p>\n<p><b>Isokline</b> = alle Punkte mit gleicher Steigung. Hängt y′ nur von y ab, sind die Isoklinen waagrechte Geraden y = c.</p>\n    <div class=\"ex\"><b>Beispiel:</b><br>y′ = x/y im Punkt P(2|1):<br>Steigung = 2/1 = 2 → Strichstück mit Steigung 2 zeichnen.</div>",Q:[
  {t:"calc",q:"y′ = 0,5x. Welche Steigung hat das Linienelement im Punkt (4|1)?",a:2,tol:0.001,e:"Einsetzen: 0,5·4 = 2. Das y spielt hier keine Rolle. (vgl. 4.19a)",topic:"Steigung im Richtungsfeld"},
  {t:"calc",q:"2y′ + y − 3 = 0. Steigung im Punkt (0|1)?",a:1,tol:0.001,e:"Erst auf y′ umformen: y′ = (3 − y)/2. Bei y = 1: (3 − 1)/2 = 1. (4.5)",topic:"Steigung im Richtungsfeld"},
  {t:"calc",q:"Bei 2y′ + y − 3 = 0: Für welches y sind alle Linienelemente waagrecht?",a:3,tol:0.001,e:"Waagrecht heißt y′ = 0 → (3 − y)/2 = 0 → y = 3.",topic:"waagrechte Linienelemente"},
  {t:"mc",q:"Bei y′ = (3 − y)/2 hängt die Steigung nur von y ab. Wie sehen die Isoklinen aus?",o:["Senkrechte Geraden x = c","Waagrechte Geraden y = c","Kreise um den Ursprung","Geraden durch den Ursprung"],a:1,e:"Gleiches y → gleiche Steigung. Also haben alle Punkte auf einer waagrechten Geraden y = c dasselbe Linienelement.",topic:"Isoklinen"},
  {t:"calc",q:"y′ = x·y². Steigung im Punkt (1|−2)?",a:4,tol:0.001,e:"1·(−2)² = 1·4 = 4. Achtung: (−2)² ist positiv.",topic:"Steigung im Richtungsfeld"},
  {t:"mc",q:"Was ist ein Linienelement?",o:["Eine Lösungskurve der DGL","Ein kurzes Tangentenstück mit der Steigung aus der DGL","Eine Gerade mit Steigung 0","Der Graph von y′"],a:1,e:"Linienelement = kurzes Strichstück im Punkt (x|y), Steigung = Wert von y′ dort.",topic:"Begriff Linienelement"},
  {t:"mc",q:"Bei y′ = x/y: Wo ist das Richtungsfeld nicht definiert?",o:["Auf der y-Achse (x = 0)","Auf der x-Achse (y = 0)","Im Punkt (1|1)","Überall definiert"],a:1,e:"Division durch y → bei y = 0 nicht definiert, also entlang der x-Achse.",topic:"Definitionsbereich"},
  {t:"mc",q:"Die allgemeine Lösung einer DGL ist …",o:["eine Zahl","eine einzelne Funktion","eine Funktionenschar"],a:2,e:"Allgemeine Lösung = Schar mit Konstante C. Erst die Anfangsbedingung macht eine Funktion daraus.",topic:"allgemeine vs. spezielle Lösung",rep:true}
]},
"04":{intro:"<p>Funktioniert bei DGL der Form <code>y′ = f(x)·g(y)</code>, also wenn sich x-Teil und y-Teil als <b>Produkt</b> schreiben lassen.</p>\n<p><b>1.</b> y′ als <code>dy/dx</code> schreiben<br>\n<b>2.</b> Trennen: alles mit y nach links, alles mit x nach rechts<br>\n<b>3.</b> Beide Seiten integrieren, <b>+C nur auf einer Seite</b><br>\n<b>4.</b> Nach y auflösen (Entlogarithmieren)</p>\n<p>Merke: ∫ 1/y dy = ln|y|, und e^(… + C) wird zu C·e^(…).</p>\n    <div class=\"ex\"><b>Beispiel:</b><br>y′ = 2x·y<br>dy/y = 2x dx<br>ln|y| = x² + C<br>y = C·e^(x²)</div>",Q:[
  {t:"mc",q:"Welche DGL lässt sich NICHT mit Trennen der Variablen lösen?",o:["y′ = 2x²/e^y","y′ + x = y","y′ = 2x·y","ẏ − 3t·y = 0"],a:1,e:"y′ = y − x ist eine Differenz, kein Produkt f(x)·g(y). Die anderen lassen sich als Produkt schreiben. (4.25)",topic:"Wann ist Trennen möglich"},
  {t:"mc",q:"Was ist ∫ (1/y) dy?",o:["1/y²","ln|y| + C","−1/y² + C","y + C"],a:1,e:"Die Stammfunktion von 1/y ist ln|y|. Das brauchst du fast bei jedem Trennen der Variablen.",topic:"Integral 1/y"},
  {t:"mc",q:"Löse y′ = 3y.",o:["y = 3x + C","y = C·e^(3x)","y = e^(3x) + C","y = C·e^(x/3)"],a:1,e:"dy/y = 3 dx → ln|y| = 3x + C → y = C·e^(3x).",topic:"Trennen der Variablen"},
  {t:"mc",q:"Löse y′ = y·sin(x).",o:["y = C·e^(cos x)","y = C·e^(−cos x)","y = C·e^(sin x)","y = −cos(x) + C"],a:1,e:"dy/y = sin(x) dx → ln|y| = −cos(x) + C → y = C·e^(−cos x). Stammfunktion von sin ist −cos! (Wissens-Check 4)",topic:"Trennen der Variablen"},
  {t:"calc",q:"−5·dy/dx + 4y = 0 hat die Lösung y = C·e^(k·x). Wie groß ist k?",a:0.8,tol:0.001,e:"Umformen: 5·dy/dx = 4y → dy/dx = 0,8y → y = C·e^(0,8x). (4.27a)",topic:"Trennen der Variablen"},
  {t:"mc",q:"Löse y′ = 2·(5 − y).",o:["y = 5 + C·e^(2x)","y = 5 − C·e^(−2x)","y = C·e^(−2x)","y = 5 − C·e^(2x)"],a:1,e:"dy/(5 − y) = 2 dx → −ln|5 − y| = 2x + C (Minus durch lineare Substitution!) → 5 − y = C·e^(−2x) → y = 5 − C·e^(−2x). (4.31a)",topic:"lineare Substitution beim Integrieren"},
  {t:"mc",q:"Warum schreibt man beim Integrieren nur auf einer Seite +C?",o:["Weil die linke Seite keine Konstante hat","Weil sich zwei Konstanten zu einer zusammenfassen lassen","Weil C immer 0 ist","Das ist ein Fehler, man braucht zwei"],a:1,e:"C₂ − C₁ ist wieder nur eine beliebige Konstante. Also reicht ein C.",topic:"Integrationskonstante"},
  {t:"calc",q:"Steigung des Linienelements von y′ = x + y im Punkt (2|3)?",a:5,tol:0,e:"2 + 3 = 5.",topic:"Steigung im Richtungsfeld",rep:true}
]},
"05":{intro:"<p>Zuerst allgemeine Lösung bestimmen, dann <b>Anfangsbedingung einsetzen</b> und nach C auflösen.</p>\n<p><b>Typische Fehler:</b><br>\n• C vergessen oder erst nach dem Entlogarithmieren dazuschreiben<br>\n• e^(x + C) ist <b>nicht</b> e^x + C, sondern e^x·e^C = C·e^x<br>\n• Summe wie Produkt behandeln: y + 4 ist nicht y·4!<br>\n• Minus bei ∫ 1/(a − y) dy vergessen</p>\n    <div class=\"ex\"><b>Beispiel:</b><br>y′ = 2x·y, y(0) = 5<br>Allgemein: y = C·e^(x²)<br>5 = C·e⁰ = C → y = 5·e^(x²)</div>",Q:[
  {t:"calc",q:"y′ = 2x·y hat y = C·e^(x²). Bestimme C für y(0) = 5.",a:5,tol:0,e:"5 = C·e⁰ = C·1 → C = 5. (4.26a)",topic:"Konstante aus Anfangsbedingung"},
  {t:"calc",q:"y′ = y·sin(x) hat y = C·e^(−cos x). Bestimme C für y(π/2) = 2.",a:2,tol:0.001,e:"cos(π/2) = 0 → 2 = C·e⁰ = C → C = 2. (4.26c)",topic:"Konstante aus Anfangsbedingung"},
  {t:"calc",q:"y′ + y = 3 hat y = 3 − C·e^(−x). Bestimme C für y(0) = 1.",a:2,tol:0.001,e:"1 = 3 − C·1 → C = 2. (vgl. 4.24)",topic:"Konstante aus Anfangsbedingung"},
  {t:"mc",q:"Angelika löst y′ = y + 4 so: dy/y = 4dx → ln|y| = 4x + C → y = C·e^(4x). Was ist der Fehler?",o:["Sie hat C vergessen","Sie hat y + 4 wie y·4 behandelt","Sie hat falsch entlogarithmiert","Kein Fehler"],a:1,e:"y + 4 ist eine Summe. Richtig trennen: dy/(y + 4) = dx. (4.34)",topic:"Summe vs. Produkt beim Trennen"},
  {t:"mc",q:"Was ist die richtige Lösung von y′ = y + 4?",o:["y = C·e^(4x)","y = C·e^x − 4","y = C·e^x + 4","y = e^x + 4 + C"],a:1,e:"dy/(y + 4) = dx → ln|y + 4| = x + C → y + 4 = C·e^x → y = C·e^x − 4.",topic:"Summe vs. Produkt beim Trennen"},
  {t:"mc",q:"e^(x + C) ist gleich …",o:["e^x + C","e^x + e^C","C·e^x (mit neuem C)","x·e^C"],a:2,e:"Potenzregel: e^(x + C) = e^x·e^C. e^C ist eine Konstante → neu C nennen.",topic:"Entlogarithmieren"},
  {t:"mc",q:"Löse y′/x² + y = 0 mit y(0) = 2.",o:["y = 2·e^(−x³/3)","y = 2·e^(x³/3)","y = 2 − x³/3","y = 2·e^(−x²)"],a:0,e:"y′ = −x²·y → dy/y = −x² dx → ln|y| = −x³/3 + C → y = C·e^(−x³/3). y(0) = 2 → C = 2. (4.30b)",topic:"Trennen der Variablen"},
  {t:"mc",q:"„Die Masse m nimmt ab, die Änderungsrate ist direkt proportional zu m.“ (k > 0)",o:["m′ = k·m","m′ = −k·m","m′ = −k/m","m′ = −k"],a:1,e:"Direkt proportional → k·m, Abnahme → Minus.",topic:"Vorzeichen bei Abnahme",rep:true}
]},
"06":{intro:"<p>Gemischte Wiederholung von heute: Begriffe, Text → DGL, Richtungsfeld, Trennen der Variablen.</p>\n<p>Kurz-Check im Kopf:<br>\n• Ordnung = höchste Ableitung<br>\n• allgemein = Schar mit C, speziell = C festgelegt<br>\n• y′ = f(x)·g(y) → trennen, integrieren, auflösen<br>\n• ∫ 1/y dy = ln|y|</p>\n    <div class=\"ex\"><b>Beispiel:</b><br>y′ = −2y → y = C·e^(−2x)<br>y(0) = 7 → y = 7·e^(−2x)</div>",Q:[
  {t:"mc",q:"y = C·e^(2x) ist …",o:["eine spezielle Lösung","eine allgemeine Lösung","eine Anfangsbedingung","ein Richtungsfeld"],a:1,e:"Das C ist noch frei → Funktionenschar → allgemeine Lösung.",topic:"allgemeine vs. spezielle Lösung",rep:true},
  {t:"calc",q:"Welche Ordnung hat y‴ − 2y = sin(x)?",a:3,tol:0,e:"Höchste Ableitung y‴ → 3. Ordnung.",topic:"Ordnung einer DGL",rep:true},
  {t:"mc",q:"„Das Volumen V eines Germteigs nimmt zu, direkt proportional zum vorhandenen Volumen.“",o:["dV/dt = k·V","dV/dt = −k·V","dV/dt = k/V","dV/dt = k·t"],a:0,e:"Zunahme, direkt proportional zu V → dV/dt = k·V. (4.9b)",topic:"DGL aus Text aufstellen",rep:true},
  {t:"calc",q:"y′ = y − x. Steigung im Punkt (1|3)?",a:2,tol:0,e:"3 − 1 = 2.",topic:"Steigung im Richtungsfeld",rep:true},
  {t:"mc",q:"Welche DGL ist trennbar?",o:["y′ = x + y","y′ = x·y","y′ = sin(x) + y"],a:1,e:"Nur x·y ist ein Produkt f(x)·g(y).",topic:"Wann ist Trennen möglich",rep:true},
  {t:"calc",q:"5y′ − 3y = 0 hat y = C·e^(k·x). k = ?",a:0.6,tol:0.001,e:"y′ = 3y/5 = 0,6y → y = C·e^(0,6x). (4.28c)",topic:"Trennen der Variablen",rep:true},
  {t:"calc",q:"y′ = 4y, y(0) = 3. Berechne y(0,5) auf 2 Dezimalstellen.",a:22.17,tol:0.02,e:"y = 3·e^(4x). y(0,5) = 3·e² ≈ 3·7,389 ≈ 22,17.",topic:"Konstante aus Anfangsbedingung",rep:true},
  {t:"mc",q:"Löse y′ = 2·(5 − y). Welches Vorzeichen steht im Exponenten?",o:["y = 5 − C·e^(2x)","y = 5 − C·e^(−2x)"],a:1,e:"∫ dy/(5 − y) = −ln|5 − y| → Minus wandert in den Exponenten: e^(−2x).",topic:"lineare Substitution beim Integrieren",rep:true}

var $=function(id){return document.getElementById(id)};
var ST={done:{},xp:0,streak:0,last:null};
function load(){try{var s=JSON.parse(localStorage.getItem("lern")||"{}");ST.done=s.done||{};ST.xp=s.xp||0;ST.streak=s.streak||0;ST.last=s.last||null}catch(e){}}
function save(){try{localStorage.setItem("lern",JSON.stringify(ST))}catch(e){}}
function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function avail(x){return !!LESSONS[x.id]}
function nextOpen(after){var L=DATA.lessons,start=0;if(after){for(var k=0;k<L.length;k++)if(L[k].id===after)start=k+1}
  for(var j=start;j<L.length;j++)if(avail(L[j])&&!ST.done[L[j].id])return L[j];
  for(j=0;j<L.length;j++)if(avail(L[j])&&!ST.done[L[j].id])return L[j];return null}

function home(){
  $("home").classList.remove("hide");$("lesson").classList.add("hide");window.scrollTo(0,0);
  $("streak").textContent=Math.max(DATA.streak,ST.streak);
  $("xp").textContent=Math.max(DATA.xp,ST.xp);
  $("cnt").textContent=Object.keys(ST.done).length+"/"+DATA.lessons.length;
  var ep=DATA.exam.split("-"),now=new Date();
  var d=Math.round((new Date(+ep[0],ep[1]-1,+ep[2])-new Date(now.getFullYear(),now.getMonth(),now.getDate()))/864e5);
  $("sa").textContent=d>0?"Schularbeit in "+d+" Tag"+(d===1?"":"en"):"Schularbeit: "+DATA.exam;
  var nx=nextOpen();$("cont").classList.toggle("hide",!nx);if(nx)$("cont").onclick=function(){openL(nx.id)};
  var box=$("list");box.innerHTML="";
  DATA.days.forEach(function(dy){
    var h=document.createElement("h2");h.className="day";h.innerHTML=dy.day+' <span class="mut">· '+dy.time+'</span>';box.appendChild(h);
    DATA.lessons.filter(function(x){return x.day===dy.day}).forEach(function(x){
      var c=ST.done[x.id],b=document.createElement("button");
      b.className="ls"+(c?" done":"");b.disabled=!avail(x);
      var rep=/Wiederholung/.test(x.title)?"🔁 ":"";
      b.innerHTML='<span class="n">'+x.id+'</span><span>'+rep+x.title+'</span><span class="sc">'+(c?"✓ "+c.score:(avail(x)?"neu":"🔒"))+'</span>';
      b.onclick=function(){openL(x.id)};box.appendChild(b);
    });
    var bk=document.createElement("div");bk.className="book";bk.textContent="📝 Buch auf Papier: "+dy.book;box.appendChild(bk);
  });
}

var CUR,Q,i,right,wrong;
function part(id){["intro","quiz","end"].forEach(function(s){$(s).classList.toggle("hide",s!==id)})}
function openL(id){
  CUR=id;var meta=DATA.lessons.filter(function(x){return x.id===id})[0];
  Q=LESSONS[id].Q;i=0;right=0;wrong=[];
  $("home").classList.add("hide");$("lesson").classList.remove("hide");
  $("ttl").textContent="L"+id+" · "+meta.title;$("introcard").innerHTML=LESSONS[id].intro;
  $("bar").style.width="0";part("intro");window.scrollTo(0,0);
}
$("back").onclick=home;$("home2").onclick=home;
$("start").onclick=function(){part("quiz");ask()};
function norm(s){return String(s).trim().toLowerCase().replace(/\s+/g," ")}
function ask(){
  var x=Q[i];$("qcnt").textContent="Frage "+(i+1)+" von "+Q.length;
  $("bar").style.width=(i/Q.length*100)+"%";
  $("rep").classList.toggle("hide",!x.rep);
  $("q").textContent=x.q;$("fb").className="fb hide";$("next").classList.add("hide");
  var a=$("ans");a.innerHTML="";window.scrollTo(0,0);
  if(x.t==="mc"){x.o.forEach(function(o,k){var b=document.createElement("button");b.className="btn";b.textContent=o;b.onclick=function(){done(k===x.a,b)};a.appendChild(b)})}
  else{
    var inp=document.createElement("input");inp.className="in";inp.autocomplete="off";inp.autocapitalize="none";
    if(x.t==="calc")inp.inputMode="decimal";
    var b=document.createElement("button");b.className="btn go";b.textContent="Prüfen";
    b.onclick=function(){var v=inp.value;if(!v.trim())return;var ok;
      if(x.t==="calc"){ok=Math.abs(parseFloat(v.replace(",","."))-x.a)<=(x.tol||0)}
      else{ok=x.a.some(function(z){return norm(z)===norm(v)})}
      inp.disabled=true;done(ok,b)};
    a.appendChild(inp);a.appendChild(b);
  }
}
function done(ok,btn){
  var x=Q[i];
  if(x.t==="mc"){var bs=$("ans").children;for(var k=0;k<bs.length;k++){bs[k].disabled=true;if(k===x.a)bs[k].classList.add("ok")}if(!ok)btn.classList.add("no")}
  else btn.disabled=true;
  if(ok)right++;else wrong.push(i+1);
  var sol=x.t==="mc"?x.o[x.a]:(x.t==="calc"?String(x.a).replace(".",","):x.a[0]);
  var f=$("fb");f.className="fb "+(ok?"ok":"no");
  f.innerHTML=(ok?"✅ <b>Richtig!</b> ":"❌ <b>Nicht ganz.</b> Richtig: <b>"+sol+"</b>. ")+"<br>"+x.e;
  var n=$("next");n.classList.remove("hide");n.textContent=i===Q.length-1?"Ergebnis →":"Weiter →";
  n.scrollIntoView({behavior:"smooth",block:"center"});
}
$("next").onclick=function(){i++;if(i<Q.length)ask();else finish()};
function finish(){
  $("bar").style.width="100%";part("end");window.scrollTo(0,0);
  var xp=right*10+20+(right===Q.length?10:0),sc=right+"/"+Q.length;
  $("score").textContent=(right===Q.length?"🎉 ":"👍 ")+sc+" richtig";
  $("xpmsg").textContent="+"+xp+" XP";
  var code="L"+CUR+" "+sc+(wrong.length?" falsch:"+wrong.join(","):"");
  $("code").textContent=code;$("copy").textContent="📋 Code kopieren";
  $("copy").onclick=function(){if(navigator.clipboard)navigator.clipboard.writeText(code).then(function(){$("copy").textContent="✓ Kopiert"},function(){})};
  if(!ST.done[CUR])ST.xp+=xp;
  ST.done[CUR]={score:sc,date:today(),code:code};
  var t=today();if(ST.last!==t){var d=ST.last?(new Date(t)-new Date(ST.last))/864e5:99;ST.streak=d<=1?(ST.streak||0)+1:1;ST.last=t}
  save();
  var nx=nextOpen(CUR);$("nextl").classList.toggle("hide",!nx);if(nx)$("nextl").onclick=function(){openL(nx.id)};
}
load();home();
</script>

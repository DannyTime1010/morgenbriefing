<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lernen · DGL</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1f2430;--mut:#6b7280;--ac:#58cc02;--acd:#46a302;--bd:#e5e7eb;--okbg:#e7f9d4}
@media(prefers-color-scheme:dark){:root{--bg:#131820;--card:#1d242f;--tx:#eef1f6;--mut:#9aa4b2;--bd:#2c3542;--okbg:#1f3a14}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:18px/1.5 system-ui,-apple-system,sans-serif;padding:16px;max-width:640px;margin-inline:auto}
h1{font-size:24px;margin:4px 0 4px}
.mut{color:var(--mut);font-size:15px}
.stats{display:flex;gap:10px;margin:14px 0}
.stat{flex:1;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px;text-align:center}
.stat b{display:block;font-size:26px}
a.ls{display:flex;align-items:center;gap:12px;background:var(--card);border:2px solid var(--bd);border-bottom-width:4px;border-radius:14px;padding:14px;margin:10px 0;color:var(--tx);text-decoration:none;min-height:60px}
a.ls.done{background:var(--okbg);border-color:var(--ac)}
a.ls.lock{opacity:.5;pointer-events:none}
.n{font-weight:800;min-width:34px}
.sc{margin-left:auto;font-size:14px;color:var(--mut)}
.day{font-size:19px;margin:22px 0 4px}
.book{font-size:15px;color:var(--mut);padding:4px 4px 0}
.top{display:flex;justify-content:space-between;align-items:center}
.top a{color:var(--ac);font-weight:600;text-decoration:none}
</style>
</head>
<body>
<div class="top"><h1>DGL · 1. AM-SA</h1><a href="glossary.html">Glossar →</a></div>
<div class="mut" id="sa"></div>
<div class="stats">
  <div class="stat">🔥<b id="streak">0</b><span class="mut">Streak</span></div>
  <div class="stat">⭐<b id="xp">0</b><span class="mut">XP</span></div>
  <div class="stat">✅<b id="cnt">0</b><span class="mut">Lektionen</span></div>
</div>
<div id="list"></div>

<script>
/* DATA-START (wird vom Coach aktualisiert) */
var DATA={
 "exam": "2026-11-26",
 "streak": 1,
 "xp": 0,
 "completed": {},
 "days": [
  {
   "day": "Sa 21.11.",
   "time": "1 h",
   "book": "4.8, 4.10, 4.21, 4.26a, 4.31a, 4.34"
  },
  {
   "day": "So 22.11.",
   "time": "4 h",
   "book": "4.37, 4.44, 4.41, 4.53, 4.54, 4.57, 4.51, 4.67, 4.69, 4.72"
  },
  {
   "day": "Mo 23.11.",
   "time": "30 min",
   "book": "4.77a, 4.78a"
  },
  {
   "day": "Di 24.11.",
   "time": "30 min",
   "book": "4.132, 4.134, 4.144"
  },
  {
   "day": "Mi 25.11.",
   "time": "30 min",
   "book": "Wissens-Check 1–7"
  }
 ],
 "lessons": [
  {
   "id": "01",
   "title": "Grundbegriffe: Ordnung, allgemeine & spezielle Lösung",
   "day": "Sa 21.11.",
   "file": "lessons/01-grundbegriffe-dgl.html"
  },
  {
   "id": "02",
   "title": "DGL aus Text aufstellen",
   "day": "Sa 21.11.",
   "file": "lessons/02-dgl-aus-text.html"
  },
  {
   "id": "03",
   "title": "Richtungsfeld & Linienelemente",
   "day": "Sa 21.11.",
   "file": "lessons/03-richtungsfeld.html"
  },
  {
   "id": "04",
   "title": "Trennen der Variablen I",
   "day": "Sa 21.11.",
   "file": "lessons/04-trennen-der-variablen-1.html"
  },
  {
   "id": "05",
   "title": "Trennen der Variablen II: Anfangswerte & Fehler",
   "day": "Sa 21.11.",
   "file": "lessons/05-trennen-der-variablen-2.html"
  },
  {
   "id": "06",
   "title": "Wiederholung Tag 1",
   "day": "Sa 21.11.",
   "file": "lessons/06-wiederholung-tag-1.html"
  },
  {
   "id": "07",
   "title": "Exponentielles Wachstum & Abnahme",
   "day": "So 22.11.",
   "file": "lessons/07-exponentielles-wachstum.html"
  },
  {
   "id": "08",
   "title": "Beschränktes Wachstum & Abnahme",
   "day": "So 22.11.",
   "file": "lessons/08-beschraenktes-wachstum.html"
  },
  {
   "id": "09",
   "title": "Newton'sches Abkühlungsgesetz",
   "day": "So 22.11.",
   "file": "lessons/09-newton-abkuehlung.html"
  },
  {
   "id": "10",
   "title": "Bewegungsvorgänge (Kräftegleichgewicht)",
   "day": "So 22.11.",
   "file": "lessons/10-bewegungsvorgaenge.html"
  },
  {
   "id": "11",
   "title": "Wiederholung: Anwendungen",
   "day": "So 22.11.",
   "file": "lessons/11-wiederholung-anwendungen.html"
  },
  {
   "id": "12",
   "title": "Lineare DGL: homogen/inhomogen, y = yh + yp",
   "day": "So 22.11.",
   "file": "lessons/12-lineare-dgl.html"
  },
  {
   "id": "13",
   "title": "Störterm-Ansätze: Konstante, Polynom, e-Funktion",
   "day": "So 22.11.",
   "file": "lessons/13-stoerterm-ansaetze.html"
  },
  {
   "id": "14",
   "title": "Störterm sin/cos & Koeffizientenvergleich",
   "day": "So 22.11.",
   "file": "lessons/14-stoerterm-sin-cos.html"
  },
  {
   "id": "15",
   "title": "Flüchtiger & stationärer Teil",
   "day": "So 22.11.",
   "file": "lessons/15-fluechtig-stationaer.html"
  },
  {
   "id": "16",
   "title": "RC-Glied",
   "day": "So 22.11.",
   "file": "lessons/16-rc-glied.html"
  },
  {
   "id": "17",
   "title": "RL-Glied",
   "day": "So 22.11.",
   "file": "lessons/17-rl-glied.html"
  },
  {
   "id": "18",
   "title": "Wiederholung Tag 2",
   "day": "So 22.11.",
   "file": "lessons/18-wiederholung-tag-2.html"
  },
  {
   "id": "19",
   "title": "Variation der Konstanten",
   "day": "Mo 23.11.",
   "file": "lessons/19-variation-der-konstanten.html"
  },
  {
   "id": "20",
   "title": "Wiederholung gemischt",
   "day": "Mo 23.11.",
   "file": "lessons/20-wiederholung-gemischt.html"
  },
  {
   "id": "21",
   "title": "Textaufgaben gemischt",
   "day": "Di 24.11.",
   "file": "lessons/21-textaufgaben-gemischt.html"
  },
  {
   "id": "22",
   "title": "Wiederholung gemischt",
   "day": "Di 24.11.",
   "file": "lessons/22-wiederholung-gemischt-2.html"
  },
  {
   "id": "23",
   "title": "Probe-SA Teil 1",
   "day": "Mi 25.11.",
   "file": "lessons/23-probe-sa-1.html"
  },
  {
   "id": "24",
   "title": "Probe-SA Teil 2 + Wissens-Check",
   "day": "Mi 25.11.",
   "file": "lessons/24-probe-sa-2.html"
  }
 ]
};
/* DATA-END */
var L={};try{L=JSON.parse(localStorage.getItem("lern")||"{}")}catch(e){}
var done=Object.assign({},DATA.completed,L.done||{});
document.getElementById("streak").textContent=Math.max(DATA.streak,L.streak||0);
document.getElementById("xp").textContent=Math.max(DATA.xp,L.xp||0);
document.getElementById("cnt").textContent=Object.keys(done).length+"/"+DATA.lessons.length;
var ep=DATA.exam.split("-"),now=new Date();var d=Math.round((new Date(+ep[0],ep[1]-1,+ep[2])-new Date(now.getFullYear(),now.getMonth(),now.getDate()))/864e5);
document.getElementById("sa").textContent=d>0?"Schularbeit in "+d+" Tag"+(d===1?"":"en"):"Schularbeit: "+DATA.exam;
var h="";DATA.days.forEach(function(dy){
  h+='<h2 class="day">'+dy.day+' <span class="mut">· '+dy.time+'</span></h2>';
  DATA.lessons.filter(function(x){return x.day===dy.day}).forEach(function(x){
    var c=done[x.id];var cls=c?"ls done":(x.file?"ls":"ls lock");var rep=/Wiederholung/.test(x.title)?"🔁 ":"";
    h+='<a class="'+cls+'" href="'+(x.file||"#")+'"><span class="n">'+x.id+'</span><span>'+rep+x.title+'</span><span class="sc">'+(c?"✓ "+c.score:(x.file?"neu":"🔒"))+'</span></a>';
  });
  h+='<div class="book">📝 Buch auf Papier: '+dy.book+'</div>';
});
document.getElementById("list").innerHTML=h;
</script>
</body>
</html>
